name: Triggered Deploy to AWS

on:
  push:
    branches:
      - staging
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - run: cp themes/evictionlab/layouts/robots.prod.txt themes/evictionlab/layouts/robots.txt
        if: github.ref == 'refs/heads/production'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.101.0"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v1
        with:
          node-version: "16.x"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci

      - run: hugo

      - name: Set bucket for branch
        id: deploy-bucket
        run: |
          if [[ $GITHUB_REF == 'refs/heads/production' ]]; then
              echo "S3_BUCKET=eviction-lab-website" >> $GITHUB_OUTPUT
              echo "CLOUDFRONT_ID=${{ secrets.AWS_CLOUDFRONT_ID_PROD }}" >> $GITHUB_OUTPUT
          else
              echo "S3_BUCKET=eviction-lab-website-staging" >> $GITHUB_OUTPUT
              echo "CLOUDFRONT_ID=${{ secrets.AWS_CLOUDFRONT_ID_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        uses: Hyperobjekt/s3-sync-action@master
        with:
          args: --acl public-read --follow-symlinks
        env:
          AWS_S3_BUCKET: ${{ steps.deploy-bucket.outputs.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          SOURCE_DIR: "public"
          AWS_CF_DISTRIBUTION_ID: ${{ steps.deploy-bucket.outputs.CLOUDFRONT_ID }}
