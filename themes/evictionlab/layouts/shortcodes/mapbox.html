
{{ $title := .Get "title" }}

<div
  id="{{ .Get `id` }}"
  class="visual visual--mapbox visual--{{ .Get `id` }}"
>
  {{ if $title }}
  <h3 class="visual__title">{{ $title }}</h3>
  {{ end }}
  <div class="visual__mapbox">
    <div class="visual__map map"></div>
    <div id="tooltip" class="visual__tooltip"></div>
  </div>
</div>

  <script>
    window.addEventListener("load", function () {
      Elab.Mapbox.init(document.getElementById({{ .Get "id" }}), { 
        geojson: {{ .Get "shapes" }},
        csv: {{ .Get "data" }},
        join: {{ .Get "join" }},
        column: {{ .Get "column" }},
        name: {{ .Get "name" }},
        legendTitle: {{ .Get "legendTitle" }},
        gradientType: {{ .Get "gradientType" }},
        format: {{ .Get "format" }},
        colors: {{ .Get "colors" }},
        binValues: {{ .Get "binValues" }},
        cutoffs: {{ .Get "cutoffs" }},
        useFullUSBounds: {{ .Get "useFullUSBounds" }},
        noLegend: {{ .Get "noLegend" }},
      })
    })
  </script>
